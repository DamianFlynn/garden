# Reviewer installs this template in the garden repository at
# .github/workflows/dispatch-on-push.yaml. It is not active in this repository.
name: Dispatch garden content update

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'static/**'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify the GitHub Pages repository
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GARDEN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN"
          payload=$(jq -cn --arg sha "$GARDEN_SHA" \
            '{event_type: "garden-content-update", client_payload: {sha: $sha}}')
          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/DamianFlynn/damianflynn.github.io/dispatches
